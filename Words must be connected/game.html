<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ คำต้องเชื่อม Neon Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; /* สีฟ้าสว่าง (Neon Blue) */
            --secondary: #4facfe; /* สีน้ำเงินฟ้า */
            --accent: #ff0055; /* สีชมพูแดง (Neon Red) */
            --dark: #121212; /* สีพื้นหลังเข้ม */
            --panel: #1e1e1e; /* สีพื้นหลังแผงควบคุม */
            --text: #ffffff; /* สีตัวอักษรขาว */
            --text-dim: #b0b0b0; /* สีตัวอักษรจาง */
            --gradient: linear-gradient(45deg, var(--secondary), var(--primary));
        }

        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: var(--dark); 
            background-image: 
                radial-gradient(at 10% 20%, rgba(0, 242, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(79, 172, 254, 0.15) 0px, transparent 50%);
            color: var(--text);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }

        .game-container { 
            background: var(--panel); 
            padding: 2.5rem; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 15px rgba(0, 242, 254, 0.2); 
            width: 90%; 
            max-width: 550px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .game-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 25px rgba(0, 242, 254, 0.3);
        }

        h1 { 
            font-size: 2.5rem; 
            margin-top: 0; 
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
            font-weight: 700;
        }

        p { color: var(--text-dim); font-weight: 300; }

        .status-bar { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 25px; 
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .status-value { font-size: 1.2rem; font-weight: 500; color: var(--primary); }

        .timer-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
        }

        .timer-svg {
            transform: rotate(-90deg);
        }

        .timer-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 8;
        }

        .timer-bar {
            fill: none;
            stroke: var(--primary);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 314; /* 2 * PI * r (r=50) */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
            filter: drop-shadow(0 0 5px var(--primary));
        }

        .timer-text { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem; 
            font-weight: 700;
            color: var(--text);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .word-display { 
            font-size: 1.8rem; 
            background: rgba(0, 242, 254, 0.1); 
            color: var(--primary); 
            padding: 18px; 
            border-radius: 15px; 
            margin-bottom: 25px; 
            min-height: 45px; 
            font-weight: 500;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .input-area { position: relative; }
        .input-area input { 
            width: 100%; 
            padding: 15px 20px; 
            border: 2px solid rgba(255, 255, 255, 0.1); 
            border-radius: 12px; 
            font-size: 1.1rem; 
            outline: none; 
            transition: 0.3s; 
            background: rgba(0, 0, 0, 0.2);
            color: var(--text);
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        .input-area input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .input-area input:disabled {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            cursor: not-allowed;
        }

        .log { 
            height: 120px; 
            overflow-y: auto; 
            background: rgba(0,0,0,0.2); 
            border-radius: 12px; 
            padding: 15px; 
            margin-top: 25px; 
            text-align: left; 
            font-size: 0.95rem; 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* ปรับแต่ง Scrollbar */
        .log::-webkit-scrollbar { width: 6px; }
        .log::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 3px; }
        .log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .log::-webkit-scrollbar-thumb:hover { background: rgba(0, 242, 254, 0.3); }

        .log-entry { margin-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); padding-bottom: 8px; }
        .log-player { color: var(--secondary); font-weight: 500; }
        .log-word { color: var(--text); }

        .setup-screen { display: block; }
        .play-screen { display: none; }
        
        .mode-buttons { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        
        button { 
            background: rgba(255,255,255,0.05); 
            color: var(--text); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 15px 25px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: 500;
            transition: 0.3s; 
            font-family: 'Kanit', sans-serif;
            position: relative;
            overflow: hidden;
        }

        button:hover { 
            background: rgba(0, 242, 254, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            color: var(--primary);
        }
        
        button.primary-btn {
            background: var(--gradient);
            color: #000;
            border: none;
            font-weight: 700;
        }
        
        button.primary-btn:hover {
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            color: #000;
            transform: scale(1.03);
        }

        .player-turn { 
            color: var(--text); 
            font-size: 1.1rem; 
            font-weight: 300; 
            margin-bottom: 20px; 
        }
        
        #current-player-name {
            color: var(--primary);
            font-weight: 500;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        
        .reset-btn-container { margin-top: 25px; }
        
        button.danger-btn {
            background: rgba(255, 0, 85, 0.1);
            color: var(--accent);
            border-color: rgba(255, 0, 85, 0.3);
            font-size: 0.9rem;
            padding: 10px 20px;
        }
        
        button.danger-btn:hover {
            background: rgba(255, 0, 85, 0.2);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
            color: var(--accent);
        }

    </style>
</head>
<body>

<div class="game-container">
    <div id="setup" class="setup-screen">
        <h1>⚡ คำต้องเชื่อม</h1>
        <p>โหมด Neon Edition - เชื่อมคำนามให้ทันภายในเวลา!</p>
        
        <div class="mode-buttons">
            <button class="primary-btn" onclick="startGame('ai')">👨‍💻 เล่นกับ AI</button>
            <button onclick="showPlayerSelection()">👥 เล่นกับเพื่อน</button>
        </div>
        
        <div id="player-count" style="display:none; margin-top:20px; border-top: 1px solid rgba(255,255,255,0.05); padding-top:20px;">
            <p>เลือกจำนวนผู้เล่น</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="startGame(2)">2 คน</button>
                <button onclick="startGame(3)">3 คน</button>
                <button onclick="startGame(4)">4 คน</button>
            </div>
        </div>
    </div>

    <div id="game" class="play-screen">
        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">Level</span>
                <span id="level-display" class="status-value">1</span>
            </div>
            <div class="status-item">
                <span class="status-label">รอบที่</span>
                <span id="score-display" class="status-value">1</span>
            </div>
        </div>
        
        <div class="player-turn">ตาของ: <span id="current-player-name">คุณ</span></div>
        
        <div class="timer-container">
            <svg class="timer-svg" width="120" height="120" viewBox="0 0 120 120">
                <circle class="timer-bg" cx="60" cy="60" r="50"></circle>
                <circle id="timer-bar" class="timer-bar" cx="60" cy="60" r="50"></circle>
            </svg>
            <div class="timer-text" id="timer">10.0</div>
        </div>
        
        <div class="word-display" id="last-word">--- เริ่มเกม ---</div>
        
        <div class="input-area">
            <input type="text" id="word-input" placeholder="พิมพ์คำนามที่นี่..." autocomplete="off">
        </div>
        
        <div class="log" id="game-log"></div>
        
        <div class="reset-btn-container">
            <button class="danger-btn" onclick="resetGame()">🏳️ ยอมแพ้ / เริ่มใหม่</button>
        </div>
    </div>
</div>

<script>
    let mode = ''; // 'ai' หรือ จำนวนคน
    let players = [];
    let currentPlayerIdx = 0;
    let usedWords = new Set();
    let initialTime = 10.0; // ปรับเวลาเริ่มต้นเป็น 10 วินาที
    let timeLeft = initialTime;
    let timerInterval;
    let level = 1;
    let round = 1;

    // คลังคำศัพท์ตัวอย่างสำหรับ AI (จำลองว่าเป็นคำนาม)
    const aiNouns = ["แมว", "สุนัข", "โต๊ะ", "โรงเรียน", "ปากกา", "แม่น้ำ", "ภูเขา", "หนังสือ", "รถยนต์", "ข้าว", "ทะเล", "ท้องฟ้า", "คอมพิวเตอร์", "โทรศัพท์", "พัดลม", "จาน", "ช้อน", "ปลา", "เสือ", "กระเป๋า", "นาฬิกา", "แว่นตา", "รองเท้า", "เสื้อผ้า", "บ้าน", "ถนน", "เครื่องบิน", "รถไฟ", "ดอกไม้", "ต้นไม้"];

    const wordInput = document.getElementById('word-input');
    const lastWordDisplay = document.getElementById('last-word');
    const timerDisplay = document.getElementById('timer');
    const timerBar = document.getElementById('timer-bar');
    const logDisplay = document.getElementById('game-log');
    const timerCircumference = 2 * Math.PI * 50; // 314.159...

    function showPlayerSelection() {
        document.getElementById('player-count').style.display = 'block';
    }

    function startGame(selectedMode) {
        mode = selectedMode;
        document.getElementById('setup').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        
        if(mode === 'ai') {
            players = ['คุณ', 'AI Bot'];
        } else {
            for(let i=1; i<=mode; i++) players.push('ผู้เล่น ' + i);
        }
        
        nextTurn();
    }

    function nextTurn() {
        clearInterval(timerInterval);
        
        // เพิ่มความยาก (ลดเวลาลงเล็กน้อยเมื่อเล่นไปนานๆ)
        // เริ่มที่ 10 วิ, เลเวล 2 เหลือ 9 วิ, เลเวล 3 เหลือ 8 วิ... ต่ำสุดที่ 3 วิ
        let difficultyReduction = Math.floor(usedWords.size / 8); 
        timeLeft = Math.max(3.0, initialTime - difficultyReduction);
        
        level = difficultyReduction + 1;
        document.getElementById('level-display').innerText = level;
        
        document.getElementById('current-player-name').innerText = players[currentPlayerIdx];
        
        // อัปเดต UI ตัวจับเวลา
        updateTimerUI(timeLeft, timeLeft); // set full bar
        
        if (players[currentPlayerIdx].includes('AI')) {
            wordInput.disabled = true;
            // AI ใช้เวลาคิดซักพัก (1-2 วิ)
            let aiThinkTime = 1000 + Math.random() * 1000;
            setTimeout(aiPlay, aiThinkTime);
        } else {
            wordInput.disabled = false;
            wordInput.focus();
            startTimer(timeLeft);
        }
    }

    function startTimer(maxTime) {
        const startTime = Date.now();
        const endTime = startTime + timeLeft * 1000;

        timerInterval = setInterval(() => {
            const now = Date.now();
            timeLeft = Math.max(0, (endTime - now) / 1000);
            
            updateTimerUI(timeLeft, maxTime);
            
            if (timeLeft <= 0) {
                gameOver(`หมดเวลา! ${players[currentPlayerIdx]} แพ้แล้ว`);
            }
        }, 50); // อัปเดตถี่ขึ้นเพื่อความลื่นไหล
    }
    
    function updateTimerUI(current, max) {
        // อัปเดตตัวเลข
        timerDisplay.innerText = current.toFixed(1);
        
        // อัปเดตวงกลม Progress Bar
        const offset = timerCircumference - (current / max) * timerCircumference;
        timerBar.style.strokeDashoffset = offset;
        
        // เปลี่ยนสีตามเวลาที่เหลือ
        if (current <= 3) {
            timerBar.style.stroke = "var(--accent)";
            timerBar.style.filter = "drop-shadow(0 0 5px var(--accent))";
        } else {
            timerBar.style.stroke = "var(--primary)";
            timerBar.style.filter = "drop-shadow(0 0 5px var(--primary))";
        }
    }

    wordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const word = wordInput.value.trim();
            // เช็คว่าใช่ตาของคนหรือไม่ และไม่ได้กดรัวๆ
            if (!wordInput.disabled) {
                processWord(word);
            }
        }
    });

    function processWord(word) {
        if (!word) return;

        // กฎการตัดสิน (Validation)
        if (usedWords.has(word)) {
            gameOver(`คำว่า "${word}" ถูกใช้ไปแล้ว!`);
            return;
        }

        // เช็คเบื้องต้น (ดักจับคำกริยา/คำวิเศษณ์พื้นฐาน)
        const forbiddenPrefix = ["กิน", "เดิน", "นอน", "วิ่ง", "กระโดด", "สวย", "ดี", "เลว", "ทำ", "ไป", "มา"]; 
        let isVerbOrAdj = forbiddenPrefix.some(v => word.startsWith(v) && word.length <= 5);

        if (isVerbOrAdj) {
            gameOver(`"${word}" เป็นคำกริยาหรือคำวิเศษณ์! (ผิดกฎ)`);
            return;
        }

        // ผ่านเกณฑ์
        addWord(word);
    }

    function addWord(word) {
        usedWords.add(word);
        lastWordDisplay.innerText = word;
        
        // เพิ่มลงใน Log
        logDisplay.innerHTML = `<div class="log-entry"><span class="log-player">${players[currentPlayerIdx]}:</span> <span class="log-word">${word}</span></div>` + logDisplay.innerHTML;
        
        wordInput.value = '';
        
        currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
        round++;
        document.getElementById('score-display').innerText = round;
        nextTurn();
    }

    function aiPlay() {
        // ตรวจสอบว่าเกมจบไปหรือยัง (อาจกดรีเซ็ตตอน AI คิด)
        if (document.getElementById('game').style.display === 'none') return;
        
        // AI สุ่มคำจากคลังที่ยังไม่เคยใช้
        const availableWords = aiNouns.filter(w => !usedWords.has(w));
        if (availableWords.length > 0) {
            const pick = availableWords[Math.floor(Math.random() * availableWords.length)];
            addWord(pick);
        } else {
            gameOver("AI Bot นึกคำไม่ออกแล้ว! คุณชนะ 🎉");
        }
    }

    function gameOver(reason) {
        clearInterval(timerInterval);
        // แสดง Alert แบบสวยงาม (ใช้ setTimeout เพื่อให้ UI อัปเดตก่อน)
        setTimeout(() => {
            alert(`💥 จบเกม! \nเหตุผล: ${reason}`);
            resetGame();
        }, 100);
    }

    function resetGame() {
        clearInterval(timerInterval);
        usedWords.clear();
        currentPlayerIdx = 0;
        round = 1;
        level = 1;
        logDisplay.innerHTML = '';
        lastWordDisplay.innerText = '--- เริ่มเกม ---';
        
        document.getElementById('setup').style.display = 'block';
        document.getElementById('game').style.display = 'none';
        document.getElementById('player-count').style.display = 'none';
        players = [];
    }
</script>

</body>
</html>
